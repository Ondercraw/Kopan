<nav class="pagination" aria-label="Paginación">
  <button type="button" class="arrow" [disabled]="page()===1" (click)="goTo(page()-1)" aria-label="Página anterior"><i class="ti ti-chevron-left"></i></button>
  @for(number of visiblePages();track number){<button type="button" class="page" [class.active]="number===page()" [attr.aria-current]="number===page()?'page':null" (click)="goTo(number)">{{number}}</button>}
  <button type="button" class="arrow" [disabled]="page()===totalPages()" (click)="goTo(page()+1)" aria-label="Página siguiente"><i class="ti ti-chevron-right"></i></button>
  <input type="number" min="1" [max]="totalPages()" inputmode="numeric" aria-label="Ir manualmente a una página" title="Escribí un número de página y presioná Enter" (change)="manual($event)" (keydown.enter)="manual($event)" />
</nav>
