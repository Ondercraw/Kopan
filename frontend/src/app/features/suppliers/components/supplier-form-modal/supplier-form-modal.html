<div class="modal-overlay">
  <section
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="supplier-title"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <span>Proveedores</span>
        <h2 id="supplier-title">{{ supplier ? 'Editar proveedor' : 'Agregar proveedor' }}</h2>
      </div>
      <button type="button" aria-label="Cerrar" (click)="close()"><i class="ti ti-x"></i></button>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="automatic-id">
        <i class="ti ti-hash"></i
        >{{ supplier ? '#' + supplier.codigo : 'El ID se asigna automáticamente' }}
      </div>
      <div class="grid">
        <label class="wide"><span>Nombre o razón social *</span>
          <input autofocus formControlName="nombre" maxlength="120" [class.field-invalid]="form.controls.nombre.invalid && form.controls.nombre.touched" />
          @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
            <small class="field-error">Ingresá un nombre de entre 2 y 120 caracteres.</small>
          }
        </label>
        <label
          ><span>CUIT</span
          ><input formControlName="cuit" inputmode="numeric" maxlength="20" />
          @if (form.controls.cuit.invalid && form.controls.cuit.touched) { <small class="field-error">El CUIT no puede superar los 20 caracteres.</small> }
        </label>
        <label><span>Persona de contacto</span><input formControlName="contacto" maxlength="80" />
          @if (form.controls.contacto.invalid && form.controls.contacto.touched) { <small class="field-error">El contacto no puede superar los 80 caracteres.</small> }
        </label>
        <label><span>Teléfono</span><input formControlName="telefono" type="tel" maxlength="40" />
          @if (form.controls.telefono.invalid && form.controls.telefono.touched) { <small class="field-error">El teléfono no puede superar los 40 caracteres.</small> }
        </label>
        <label><span>Email</span><input formControlName="email" type="email" maxlength="254" [class.field-invalid]="form.controls.email.invalid && form.controls.email.touched" />
          @if (form.controls.email.hasError('email') && form.controls.email.touched) { <small class="field-error">Ingresá un email válido, por ejemplo nombre@empresa.com.</small> }
          @if (form.controls.email.hasError('maxlength') && form.controls.email.touched) { <small class="field-error">El email no puede superar los 254 caracteres.</small> }
        </label>
        <label><span>Dirección</span><input formControlName="direccion" maxlength="180" />
          @if (form.controls.direccion.invalid && form.controls.direccion.touched) { <small class="field-error">La dirección no puede superar los 180 caracteres.</small> }
        </label>
        <label><span>Localidad</span><input formControlName="localidad" maxlength="80" />
          @if (form.controls.localidad.invalid && form.controls.localidad.touched) { <small class="field-error">La localidad no puede superar los 80 caracteres.</small> }
        </label>
        <label class="wide"
          ><span>Observaciones</span
          ><textarea rows="3" maxlength="500" formControlName="observaciones"></textarea
          ><small>{{ form.controls.observaciones.value.length }} / 500 caracteres</small>
          @if (form.controls.observaciones.invalid && form.controls.observaciones.touched) {
            <small class="field-error">Las observaciones no pueden superar los 500 caracteres.</small>
          }
        </label
        >
      </div>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <footer>
        <button type="button" class="secondary" (click)="close()">Cancelar</button
        ><button type="submit" class="primary" [disabled]="saving()">
          {{ saving() ? 'Guardando…' : 'Guardar proveedor' }}
        </button>
      </footer>
    </form>
  </section>
</div>
